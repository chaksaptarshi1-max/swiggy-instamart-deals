name: Swiggy Instamart Keyword Deal Hunter

on:
  schedule:
    # 30-Minute Interval Deal Hunter (09:01 AM to 12:01 AM midnight IST)
    - cron: '31 3-18 * * *'
    - cron: '1 4-18 * * *'

  workflow_dispatch:
    inputs:
      skip_sync:
        description: 'Skip top-of-hour wait sync (run immediately)'
        type: boolean
        required: false
        default: false

jobs:
  hunt:
    name: Worker (${{ matrix.worker }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        worker: [fresh, grocery, treats, munchies, beverages, personal, lifestyle]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'swiggy-telegram-bot/package-lock.json'

      - name: Install Dependencies
        working-directory: swiggy-telegram-bot
        run: npm ci || npm install

      - name: Restore Deal Cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: deal-cache-${{ matrix.worker }}-${{ github.run_id }}
          restore-keys: |
            deal-cache-${{ matrix.worker }}-

      - name: Run ${{ matrix.worker }} Deal Hunter
        working-directory: swiggy-telegram-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SWIGGY_STORE_ID: ${{ secrets.SWIGGY_STORE_ID }}
          SWIGGY_PRIMARY_STORE_ID: ${{ secrets.SWIGGY_PRIMARY_STORE_ID }}
          SWIGGY_SECONDARY_STORE_ID: ${{ secrets.SWIGGY_SECONDARY_STORE_ID }}
          SWIGGY_COOKIE: ${{ secrets.SWIGGY_COOKIE }}
          FRESH_MIN_DISCOUNT: ${{ secrets.FRESH_MIN_DISCOUNT || secrets.ESSENTIALS_MIN_DISCOUNT }}
          GROCERY_MIN_DISCOUNT: ${{ secrets.GROCERY_MIN_DISCOUNT || secrets.ESSENTIALS_MIN_DISCOUNT }}
          ESSENTIALS_MIN_DISCOUNT: ${{ secrets.ESSENTIALS_MIN_DISCOUNT }}
          TREATS_MIN_DISCOUNT: ${{ secrets.TREATS_MIN_DISCOUNT }}
          MUNCHIES_MIN_DISCOUNT: ${{ secrets.MUNCHIES_MIN_DISCOUNT || secrets.TREATS_MIN_DISCOUNT }}
          LIFESTYLE_MIN_DISCOUNT: ${{ secrets.LIFESTYLE_MIN_DISCOUNT }}
          BEVERAGES_MIN_DISCOUNT: ${{ secrets.BEVERAGES_MIN_DISCOUNT }}
          PERSONAL_MIN_DISCOUNT: ${{ secrets.PERSONAL_MIN_DISCOUNT }}
          USE_BROWSER: 'true'
          SKIP_SYNC: ${{ inputs.skip_sync }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

        run: |
          EXTRA_FLAGS=""

          if [ "$SKIP_SYNC" = "true" ]; then
            EXTRA_FLAGS="--skip-sync"
          fi

          echo "Executing Deal Hunter Worker: ${{ matrix.worker }}..."

          node src/cron-runner.js ${{ matrix.worker }} $EXTRA_FLAGS

      - name: Save Deal Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: swiggy-telegram-bot/data
          key: deal-cache-${{ matrix.worker }}-${{ github.run_id }}

      - name: Upload Worker Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deal-results-${{ matrix.worker }}
          path: swiggy-telegram-bot/results/
          if-no-files-found: ignore


  combine-results:
    name: Create Combined CSV
    runs-on: ubuntu-latest
    needs: hunt
    if: always()

    steps:
      - name: Download All Worker Results
        uses: actions/download-artifact@v4
        with:
          pattern: deal-results-*
          path: all-results
          merge-multiple: false

      - name: Create Combined CSV
        shell: bash
        run: |
          mkdir -p combined

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = 'all-results';
          const output = 'combined/all-deals.csv';

          const rows = [];

          function csvEscape(value) {
            if (value === null || value === undefined) return '';

            let text = String(value);

            if (
              text.includes('"') ||
              text.includes(',') ||
              text.includes('\n') ||
              text.includes('\r')
            ) {
              text = '"' + text.replace(/"/g, '""') + '"';
            }

            return text;
          }

          function findJsonFiles(dir) {
            if (!fs.existsSync(dir)) return [];

            const results = [];

            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              const fullPath = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                results.push(...findJsonFiles(fullPath));
              } else if (entry.isFile() && entry.name.endsWith('.json')) {
                results.push(fullPath);
              }
            }

            return results;
          }

          const files = findJsonFiles(root);

          console.log(`Found ${files.length} result JSON files.`);

          for (const file of files) {
            try {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              const alerts = Array.isArray(data.alerts) ? data.alerts : [];

              for (const item of alerts) {
                rows.push({
                  product: item.name || '',
                  mrp: item.mrp ?? '',
                  price: item.price ?? '',
                  discount: item.discount ?? '',
                  category: item.category || '',
                  subCategory: item.subCategory || '',
                  previousPrice: item.prevPrice ?? '',
                  previousDiscount: item.prevDiscount ?? '',
                  alertType: item.alertType || '',
                  dealType: item.dealType || data.campaign || '',
                  skuId: item.skuId || '',
                  brand: item.brand || '',
                  pack: item.pack || '',
                  rating: item.rating || '',
                  ratingCount: item.ratingCount || '',
                  link: item.itemLink || item.searchLink || ''
                });
              }
            } catch (error) {
              console.error(`Could not read ${file}:`, error.message);
            }
          }

          rows.sort((a, b) => {
            return Number(b.discount || 0) - Number(a.discount || 0);
          });

          const header = [
            'Product',
            'MRP',
            'Current Price',
            'Discount %',
            'Category',
            'Subcategory',
            'Previous Price',
            'Previous Discount %',
            'Alert Type',
            'Worker',
            'SKU ID',
            'Brand',
            'Pack',
            'Rating',
            'Rating Count',
            'Swiggy Link'
          ];

          const csv = [
            header.join(','),
            ...rows.map(row => [
              row.product,
              row.mrp,
              row.price,
              row.discount,
              row.category,
              row.subCategory,
              row.previousPrice,
              row.previousDiscount,
              row.alertType,
              row.dealType,
              row.skuId,
              row.brand,
              row.pack,
              row.rating,
              row.ratingCount,
              row.link
            ].map(csvEscape).join(','))
          ].join('\n');

          fs.writeFileSync(output, csv, 'utf8');

          console.log(`Created ${output}`);
          console.log(`Total deals: ${rows.length}`);
          NODE

      - name: Upload Combined CSV
        uses: actions/upload-artifact@v4
        with:
          name: combined-deals-csv
          path: combined/all-deals.csv
          if-no-files-found: error
